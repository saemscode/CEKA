name: CEKA Weekly Deep Intelligence (Phase A & B)

# ──────────────────────────────────────────────────────────────────────────────
# Phase A: Sovereign Refresh — every Monday 03:00 UTC (06:00 EAT)
#          Broad sweep: upgrades all bills NULL columns via AI distillation.
# Phase B: Matrix Solvency  — every Monday 05:00 UTC (08:00 EAT)
#          Surgical NULL fill: cell-level precision patching across the matrix.
#
# IMPORTANT: Each phase gates on exact equality against github.event.schedule.
# The single-cron-per-schedule approach ensures the condition can always match.
# ──────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # Phase A — Monday 03:00 UTC
    - cron: '0 3 * * 1'
    # Phase B — Monday 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      run_phase_a:
        description: 'Run Phase A: Sovereign Refresh (broad sweep, all bills)'
        type: boolean
        required: false
        default: false
      run_phase_b:
        description: 'Run Phase B: Matrix Solvency (surgical NULL fill)'
        type: boolean
        required: false
        default: false
      phase_b_column:
        description: 'Phase B Column Sweep target (e.g. constitutional_section). Leave blank for full matrix.'
        type: string
        required: false
        default: ''
      phase_b_bill_id:
        description: 'Phase B Row Full-Ham target Bill UUID. Leave blank for all bills.'
        type: string
        required: false
        default: ''
      phase_a_force:
        description: 'Phase A: Force re-process ALL bills even if data is complete'
        type: boolean
        required: false
        default: false

# ── Workflow-level env — inherited by every job ─────────────────────────────
env:
  # ── Supabase ───────────────────────────────────────────────────────────
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── LLM Providers ─────────────────────────────────────────────────────
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_API_KEY_1: ${{ secrets.OPENAI_API_KEY_1 }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DEEPSEEK_API_KEY_SECONDARY: ${{ secrets.DEEPSEEK_API_KEY_SECONDARY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  CEREBRAS_API_KEY_SECONDARY: ${{ secrets.CEREBRAS_API_KEY_SECONDARY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
  MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
  SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
  CEKA_GEMINI_API_KEY: ${{ secrets.CEKA_GEMINI_API_KEY }}
  CEKA_GROQ_API_KEY: ${{ secrets.CEKA_GROQ_API_KEY }}
  NEMOTRON_3_NVIDIA_API_KEY: ${{ secrets.NEMOTRON_3_NVIDIA_API_KEY }}
  LLAMA_4_MAVERICK_NVIDIA_API_KEY: ${{ secrets.LLAMA_4_MAVERICK_NVIDIA_API_KEY }}
  SILICON_FLOW_API_KEY: ${{ secrets.SILICON_FLOW_API_KEY }}
  CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }}

  # ── Storage & Scraping ─────────────────────────────────────────────────
  B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
  B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
  B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
  OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
  PADDLEOCR_TOKEN: ${{ secrets.PADDLEOCR_TOKEN }}
  SURYA_API_KEY: ${{ secrets.SURYA_API_KEY }}
  SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

jobs:
  # ══════════════════════════════════════════════════════════════════════
  #  Phase A — Sovereign Refresh (Broad Sweep, All Bills)
  # ══════════════════════════════════════════════════════════════════════
  phase_a_sovereign_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Fires when:
    #  a) The schedule '0 3 * * 1' triggered this run (exact equality), OR
    #  b) Manually dispatched with run_phase_a=true
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 3 * * 1' ||
      inputs.run_phase_a == true ||
      github.event.inputs.run_phase_a == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -q
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          pip install \
            supabase requests pymupdf pdfplumber python-dotenv \
            pillow pdf2image pytesseract \
            google-genai google-generativeai groq openai anthropic cohere \
            boto3 aiohttp lxml
          pip install cerebras-cloud-sdk || echo "⚠️ cerebras-cloud-sdk not available — skipping"

      - name: "Phase A: Sovereign Refresh (Weekly — All Bills Broad Sweep)"
        timeout-minutes: 280
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.phase_a_force }}" == "true" ] || [ "${{ github.event.inputs.phase_a_force }}" == "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/sovereign_refresh.py $FORCE_FLAG --limit 272
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload Phase A Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase-a-logs-${{ github.run_number }}
          path: |
            scripts/sovereign_refresh.log
          retention-days: 14
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════
  #  Phase B — Matrix Solvency (Surgical NULL Fill)
  # ══════════════════════════════════════════════════════════════════════
  phase_b_matrix_solvency:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Fires when:
    #  a) The schedule '0 5 * * 1' triggered this run (exact equality), OR
    #  b) Manually dispatched with run_phase_b=true
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 5 * * 1' ||
      inputs.run_phase_b == true ||
      github.event.inputs.run_phase_b == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -q
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          pip install \
            supabase requests pymupdf pdfplumber python-dotenv \
            pillow pdf2image pytesseract \
            google-genai google-generativeai groq openai anthropic cohere \
            boto3 aiohttp lxml
          pip install cerebras-cloud-sdk || echo "⚠️ cerebras-cloud-sdk not available — skipping"

      - name: "Phase B: Matrix Solvency (Weekly — Surgical NULL Fill)"
        timeout-minutes: 160
        run: |
          COL_FLAG=""
          BILL_FLAG=""
          if [ -n "${{ inputs.phase_b_column }}" ]; then
            COL_FLAG="--column ${{ inputs.phase_b_column }}"
          elif [ -n "${{ github.event.inputs.phase_b_column }}" ]; then
            COL_FLAG="--column ${{ github.event.inputs.phase_b_column }}"
          fi
          if [ -n "${{ inputs.phase_b_bill_id }}" ]; then
            BILL_FLAG="--bill-id ${{ inputs.phase_b_bill_id }}"
          elif [ -n "${{ github.event.inputs.phase_b_bill_id }}" ]; then
            BILL_FLAG="--bill-id ${{ github.event.inputs.phase_b_bill_id }}"
          fi
          python scripts/matrix_solvency.py $COL_FLAG $BILL_FLAG
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload Phase B Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase-b-logs-${{ github.run_number }}
          path: |
            scripts/matrix_solvency.log
          retention-days: 14
          if-no-files-found: ignore
