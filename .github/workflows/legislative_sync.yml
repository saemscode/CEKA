name: CEKA Sovereign Intelligence Sync

on:
  schedule:
    # 4AM EAT (01:00 UTC) - Primary Daily Sync
    - cron: '0 1 * * *'
    # 4PM EAT (13:00 UTC) - Afternoon Update
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase requests pymupdf python-dotenv google-generativeai
          playwright install chromium --with-deps

      - name: Run Sovereign Sync Master
        run: python CEKA/scripts/sovereign_sync_master.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload Intelligence Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-logs-${{ github.run_number }}
          path: |
            CEKA/scripts/*.log
            CEKA/scripts/processed_data/
          retention-days: 14
