name: Pieces Transaction Reconciliation
on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday, 3am UTC
  workflow_dispatch: {}   # allows manual trigger from GitHub Actions tab

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Call reconciliation function
        run: |
          curl -X POST "https://iruahxgkrucidihnfytq.supabase.co/functions/v1/pieces-reconciliation" \
            -H "x-reconciliation-key: ${{ secrets.RECONCILIATION_SECRET }}" \
            -H "Content-Type: application/json"
