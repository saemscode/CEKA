name: Native App Builds (Android & iOS)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

permissions:
  contents: write

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  build-android:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # --- VERSIONING: derive versionName from tag, versionCode from run number ---
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="0.0.0-dev.${{ github.run_number }}"
          fi
          VERSION_CODE="${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Inject version into build.gradle
        working-directory: android
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ steps.version.outputs.version_code }}/" app/build.gradle

      # --- BUILD TYPE: real release build only on a tag push, or manual dispatch set to release ---
      - name: Build Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event.inputs.build_type != 'release' }}
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in repo Settings > Secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Upload Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v5
        with:
          name: ceka-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v5
        with:
          name: ceka-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      # --- CHECKSUM: only relevant for the real, tagged release ---
      - name: Generate checksum
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android/app/build/outputs/apk/release
        run: sha256sum *.apk > checksums.txt

      # --- PUBLISH TO GITHUB RELEASES: only on a version tag push ---
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CEKA ${{ steps.version.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/checksums.txt
